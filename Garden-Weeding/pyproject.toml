[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "garden-weeding"
version = "0.0.1"
description = "Detect cryptographic implementations in C/C++ source files"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "peft",
    "huggingface-hub",
    "scikit-learn",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
quantization = [
    "bitsandbytes",
]

[project.scripts]
garden-weeding = "garden_weeding.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
garden_weeding = ["classifier.pkl"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["src/tests"]
pythonpath = ["src"]
# Also accept files named like `cache-test.py` (dash) in addition to the defaults.
python_files = ["test_*.py", "*_test.py", "*-test.py"]
