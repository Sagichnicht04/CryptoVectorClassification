[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "garden-weeding"
version = "0.0.1"
description = "Garden Weeding tool"
requires-python = ">=3.10"
dependencies = [
    "torch",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["src/tests"]
pythonpath = ["src"]
# Also accept files named like `cache-test.py` (dash) in addition to the defaults.
python_files = ["test_*.py", "*_test.py", "*-test.py"]
